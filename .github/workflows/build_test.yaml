name:  Unit Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        architecture: ["x64"]
    name: Python ${{ matrix.python-version }} on ${{ matrix.architecture }} unit test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run unit tests
        run: >-
          uv run pytest
          --ignore=tests/test_api/test_Stage_benchmark.py
          --reruns 3
          --reruns-delay 1

  benchmark-smoke:
    runs-on: ubuntu-latest
    name: Benchmark smoke (not a correctness gate)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run benchmark evidence
        run: >-
          uv run pytest
          tests/test_api/test_Stage_benchmark.py
          --benchmark-only
