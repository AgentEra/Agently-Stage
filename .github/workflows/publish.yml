name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Existing v-prefixed release tag version without the v prefix
        required: true
        type: string

concurrency:
  group: publish-agently-stage-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    name: Validate and build (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - name: Resolve release tag
        id: release
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$DISPATCH_VERSION"
          else
            version="${REF_NAME#v}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/v${{ steps.release.outputs.version }}
      - name: Verify tag belongs to main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: uv sync --all-extras --dev --locked --python ${{ matrix.python-version }}
      - name: Verify package version
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          uv run python - <<'PY'
          import importlib.metadata
          import os

          project_version = importlib.metadata.version("agently-stage")
          expected = os.environ["RELEASE_VERSION"]
          if project_version != expected:
              raise SystemExit(
                  f"tag version {expected} does not match installed project version {project_version}"
              )
          PY
      - name: Type check
        if: matrix.python-version == '3.10'
        run: uv run pyright agently_stage tests examples
      - name: Test
        run: uv run pytest -q --ignore=tests/test_api/test_Stage_benchmark.py
      - name: Lint and format check
        if: matrix.python-version == '3.10'
        run: uv run pre-commit run --all-files
      - name: Build distributions
        if: matrix.python-version == '3.10'
        run: uv build
      - name: Upload distributions
        if: matrix.python-version == '3.10'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: validate-and-build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agently-stage
    permissions:
      id-token: write
    env:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI with shared API token
        if: env.PYPI_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
      - name: Publish to PyPI with trusted publishing
        if: env.PYPI_TOKEN == ''
        uses: pypa/gh-action-pypi-publish@release/v1
